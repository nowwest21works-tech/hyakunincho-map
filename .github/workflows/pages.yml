# public/ を GitHub Pages へ配信する。
# 公開URL: https://<ユーザー名>.github.io/<リポジトリ名>/hyakunincho-map/
name: GitHub Pages へ公開

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: データ試験
        run: node --test tests/hyakunincho-map/*.test.mjs

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # 水彩画の原画（artworks/original/）と表紙の原本（journal/original/）はリポジトリに保管するだけで、公開サイトには載せない。
      - name: 公開する物をまとめる
        run: |
          mkdir _site
          cp -R public/. _site/
          rm -rf _site/hyakunincho-map/artworks/original _site/hyakunincho-map/journal/original
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}hyakunincho-map/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
